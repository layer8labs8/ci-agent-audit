name: Triage new issues
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "Triage this issue: ${{ github.event.issue.body }}"
          claude_args: "--dangerously-skip-permissions"
