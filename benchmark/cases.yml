        on: [issue_comment]
        jobs:
          dispatch:
            if: contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
            runs-on: ubuntu-latest
            outputs:
              command: ${{ steps.pick.outputs.command }}
            steps:
              - id: pick
                run: echo "command=review" >> "$GITHUB_OUTPUT"
          review:
            needs: dispatch
            if: needs.dispatch.outputs.command == 'review'
            uses: ./.github/workflows/agent.yml
      .github/workflows/agent.yml: |
        on: [workflow_call]
        permissions:
          contents: read
        jobs:
          run:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review: ${{ github.event.comment.body }}"

