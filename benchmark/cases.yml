                with:
                  prompt: "Review: ${{ github.event.pull_request.title }}"

  - name: permission-check-step-that-fails
    expect: [AIA001]
    max_severity: medium
    forbid: [AIA005, AIA006]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/github-script@v8
                with:
                  script: |
                    const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                      owner: context.repo.owner, repo: context.repo.repo, username: context.actor,
                    });
                    if (data.permission !== 'admin') core.setFailed('Not allowed');
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Answer: ${{ github.event.comment.body }}"

  - name: permission-check-output-in-a-needed-job
    expect: [AIA001]
    max_severity: medium
    forbid: [AIA005, AIA006]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        permissions:
          contents: read
        jobs:
          auth:
            runs-on: ubuntu-latest
            outputs:
              allowed: ${{ steps.check.outputs.allowed }}
            steps:
              - id: check
                run: |
                  perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
                  echo "allowed=$([ "$perm" = admin ] && echo true)" >> "$GITHUB_OUTPUT"
          ai:
            needs: auth
            if: needs.auth.outputs.allowed == 'true'
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Answer: ${{ github.event.comment.body }}"

