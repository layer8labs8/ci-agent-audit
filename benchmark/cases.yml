# Labelled cases for tools/benchmark.py. Every workflow here was written for this benchmark.
#
# expect: rules that must fire.
# forbid: rules that must not fire.
# safe: nothing may fire, except the rules in allow.
# max_severity: nothing may be reported above this level.
# gap: a risk the scanner can't see yet. It still counts against recall.

direct:
  - name: issue-body-in-prompt
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on:
          issues:
            types: [opened]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Triage: ${{ github.event.issue.body }}"

  - name: comment-body-in-prompt
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: google-github-actions/run-gemini-cli@v0.1.10
                with:
                  prompt: "Answer this: ${{ github.event.comment.body }}"

  - name: pr-title-through-env-to-cli
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [pull_request_target]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - env:
                  TITLE: ${{ github.event.pull_request.title }}
                run: claude -p "Review $TITLE"

  - name: env-chain-across-scopes
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        env:
          RAW: ${{ github.event.issue.title }}
        jobs:
          ai:
            runs-on: ubuntu-latest
            env:
              TEXT: ${{ env.RAW }}
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Label this: ${{ env.TEXT }}"

  - name: relay-through-github-env
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - env:
                  BODY: ${{ github.event.issue.body }}
                run: echo "TASK=$BODY" >> "$GITHUB_ENV"
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Do this: ${{ env.TASK }}"

  - name: relay-through-step-output
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - id: read
                env:
                  BODY: ${{ github.event.issue.body }}
                run: echo "text=$BODY" >> "$GITHUB_OUTPUT"
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Do this: ${{ steps.read.outputs.text }}"

  - name: relay-through-job-output
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          read:
            runs-on: ubuntu-latest
            outputs:
              text: ${{ steps.grab.outputs.text }}
            steps:
              - id: grab
                env:
                  BODY: ${{ github.event.issue.body }}
                run: echo "text=$BODY" >> "$GITHUB_OUTPUT"
          ai:
            needs: read
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Do this: ${{ needs.read.outputs.text }}"

  - name: relay-through-file
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - env:
                  BODY: ${{ github.event.issue.body }}
                run: echo "$BODY" > prompt.txt
              - run: claude -p "$(cat prompt.txt)"

  - name: gh-output-into-prompt
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on:
          schedule:
            - cron: "0 3 * * *"
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - id: fetch
                run: echo "text=$(gh issue view 1 --json body -q .body)" >> "$GITHUB_OUTPUT"
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Summarize: ${{ steps.fetch.outputs.text }}"

  - name: agent-told-to-fetch-issues
    expect: [AIA009]
    files:
      .github/workflows/ai.yml: |
        on:
          schedule:
            - cron: "0 3 * * *"
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Run gh issue list and triage every open issue."

  - name: event-payload-read-by-jq
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - run: jq -r .issue.body "$GITHUB_EVENT_PATH" > body.txt
              - run: claude -p "Triage the text in body.txt"

  - name: bracket-index-expression
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Triage: ${{ github.event['issue']['body'] }}"

  - name: commit-author-email
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [push]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Thank ${{ github.event.head_commit.author.email }}"

  - name: head-repo-description
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [pull_request_target]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "This fork says: ${{ github.event.pull_request.head.repo.description }}"

  - name: whole-event-tojson
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Event: ${{ toJSON(github.event) }}"

  - name: workflow-run-branch-name
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on:
          workflow_run:
            workflows: [Tests]
            types: [completed]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Why did ${{ github.event.workflow_run.head_branch }} fail?"

  - name: spoofable-bot-check
    expect: [AIA003]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        jobs:
          ai:
            if: endsWith(github.actor, '[bot]')
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Check the build."

  - name: wildcard-users
    expect: [AIA003]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Check the build."
                  allowed_non_write_users: "*"

  - name: claude-skip-permissions
    expect: [AIA002]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - run: claude -p "Fix the docs" --dangerously-skip-permissions

  - name: gemini-yolo-approval-mode
    expect: [AIA002]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - run: gemini -p "Fix the docs" --approval-mode=yolo

  - name: codex-bypass-flag
    expect: [AIA002]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - run: codex exec --dangerously-bypass-approvals-and-sandbox "Fix the docs"

  - name: codex-action-unsafe-safety-strategy
    expect: [AIA002]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: openai/codex-action@v1.4
                with:
                  prompt: "Fix the docs"
                  safety-strategy: unsafe

  - name: write-all-token
    expect: [AIA005]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        permissions: write-all
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Check the build."

  - name: no-egress-firewall
    expect: [AIA006]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Check the build."

  - name: unpinned-mcp-in-config
    expect: [AIA007]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Check the build."
                  mcp_config: '{"mcpServers":{"gh":{"command":"npx -y @modelcontextprotocol/server-github"}}}'

  - name: pr-target-checkout-of-pr-head
    expect: [AIA008]
    files:
      .github/workflows/ai.yml: |
        on: [pull_request_target]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
                with:
                  ref: ${{ github.event.pull_request.head.sha }}
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review this change."

  - name: output-into-run
    expect: [AIA010]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - id: ai
                uses: actions/ai-inference@v1.2.0
                with:
                  prompt: "Suggest a command."
              - run: ${{ steps.ai.outputs.response }}

  - name: output-chooses-checkout-ref
    expect: [AIA010]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - id: ai
                uses: actions/ai-inference@v1.2.0
                with:
                  prompt: "Pick a branch."
              - uses: actions/checkout@v7
                with:
                  ref: ${{ steps.ai.outputs.response }}

  - name: push-to-main-after-agent
    expect: [AIA011]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Update the docs."
              - run: git push origin HEAD:main

  - name: outdated-action
    expect: [AIA004]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.80
                with:
                  prompt: "Check the build."

  - name: gitlab-mr-description
    expect: [AIA001]
    files:
      .gitlab-ci.yml: |
        review:
          script:
            - claude -p "Review: $CI_MERGE_REQUEST_DESCRIPTION"

  - name: gitlab-unpinned-mcp
    expect: [AIA007]
    files:
      .gitlab-ci.yml: |
        review:
          script:
            - npx -y @modelcontextprotocol/server-github

  - name: gitlab-skip-permissions
    expect: [AIA002]
    files:
      .gitlab-ci.yml: |
        review:
          script:
            - claude -p "Fix the docs" --dangerously-skip-permissions

composite:
  - name: composite-input-into-prompt
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/triage
                with:
                  text: ${{ github.event.issue.body }}
      .github/actions/triage/action.yml: |
        name: Triage
        inputs:
          text:
            required: true
        runs:
          using: composite
          steps:
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: "Triage: ${{ inputs.text }}"

  - name: composite-input-through-env
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/answer
                with:
                  question: ${{ github.event.comment.body }}
      .github/actions/answer/action.yaml: |
        name: Answer
        inputs:
          question:
            required: true
        runs:
          using: composite
          steps:
            - shell: bash
              env:
                QUESTION: ${{ inputs.question }}
              run: claude -p "Answer $QUESTION"

  - name: composite-dangerous-flag
    expect: [AIA002]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/fix
      .github/actions/fix/action.yml: |
        name: Fix
        runs:
          using: composite
          steps:
            - shell: bash
              run: claude -p "Fix the docs" --dangerously-skip-permissions

  - name: composite-nested
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/outer
                with:
                  text: ${{ github.event.issue.title }}
      .github/actions/outer/action.yml: |
        name: Outer
        inputs:
          text:
            required: true
        runs:
          using: composite
          steps:
            - uses: ./.github/actions/inner
              with:
                task: "Label ${{ inputs.text }}"
      .github/actions/inner/action.yml: |
        name: Inner
        inputs:
          task:
            required: true
        runs:
          using: composite
          steps:
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: ${{ inputs.task }}

  - name: composite-output-into-run
    expect: [AIA010]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - id: suggest
                uses: ./.github/actions/suggest
              - run: ${{ steps.suggest.outputs.command }}
      .github/actions/suggest/action.yml: |
        name: Suggest
        outputs:
          command:
            value: ${{ steps.ai.outputs.response }}
        runs:
          using: composite
          steps:
            - id: ai
              uses: actions/ai-inference@v1.2.0
              with:
                prompt: "Suggest a command."

  - name: composite-checkout-of-pr-head
    expect: [AIA008]
    files:
      .github/workflows/ai.yml: |
        on: [pull_request_target]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/pr-code
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review this change."
      .github/actions/pr-code/action.yml: |
        name: PR code
        runs:
          using: composite
          steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.pull_request.head.sha }}

  - name: composite-default-input
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/triage
      .github/actions/triage/action.yml: |
        name: Triage
        inputs:
          text:
            default: ${{ github.event.issue.body }}
        runs:
          using: composite
          steps:
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: "Triage: ${{ inputs.text }}"

  - name: composite-direct-event
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/triage
      .github/actions/triage/action.yml: |
        name: Triage
        runs:
          using: composite
          steps:
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: "Triage: ${{ github.event.issue.body }}"

  - name: composite-hides-agent-from-token-check
    expect: [AIA005]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        permissions: write-all
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./.github/actions/agent
      .github/actions/agent/action.yml: |
        name: Agent
        runs:
          using: composite
          steps:
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: "Check the build."

  - name: composite-at-repository-root
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: ./
                with:
                  text: ${{ github.event.issue.body }}
      action.yml: |
        name: Root
        inputs:
          text:
            required: true
        runs:
          using: composite
          steps:
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: ${{ inputs.text }}

reusable:
  - name: reusable-input-into-prompt
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            uses: ./.github/workflows/agent.yml
