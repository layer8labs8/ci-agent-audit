          ai:
            runs-on: ubuntu-latest
            steps:
              - env:
                  BODY: ${{ github.event.issue.body }}
                run: python scripts/triage.py

  - name: agent-inside-docker-run
    gap: true
    expect: [AIA001]
    files:
