                run: opencode run "$BODY"

safe:
  - name: trusted-prompt
    safe: true
    files:
      .github/workflows/ai.yml: |
        on: [pull_request]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review the diff for security bugs."

  - name: issue-number-only
    safe: true
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: step-security/harden-runner@v2
                with:
                  egress-policy: block
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Label issue ${{ github.event.issue.number }}."

  - name: body-in-another-job
    safe: true
    files:
