  - name: reusable-output-into-run
    expect: [AIA010]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ask:
            uses: ./.github/workflows/agent.yml
          act:
            needs: ask
            runs-on: ubuntu-latest
            steps:
              - run: ${{ needs.ask.outputs.command }}
      .github/workflows/agent.yml: |
        on:
          workflow_call:
