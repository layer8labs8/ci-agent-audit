          steps:
            - shell: bash
              env:
                TITLE: ${{ inputs.title }}
              run: echo "$TITLE"
            - uses: anthropics/claude-code-action@v1.0.100
              with:
                prompt: "Review the docs."

  - name: composite-call-behind-author-check
    expect: [AIA001]
    max_severity: medium
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - if: github.event.issue.author_association == 'OWNER'
