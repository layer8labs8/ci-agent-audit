              command:
                value: ${{ jobs.run.outputs.answer }}
        jobs:
          run:
            runs-on: ubuntu-latest
            outputs:
              answer: ${{ steps.ai.outputs.response }}
            steps:
              - id: ai
                uses: actions/ai-inference@v1.2.0
                with:
                  prompt: "Suggest a command."

  - name: reusable-checkout-of-pr-head
    expect: [AIA008]
    files:
      .github/workflows/ai.yml: |
        on: [pull_request_target]
        jobs:
          ai:
            uses: ./.github/workflows/agent.yml
      .github/workflows/agent.yml: |
        on: [workflow_call]
        jobs:
          run:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
                with:
                  ref: ${{ github.event.pull_request.head.sha }}
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review this change."

  - name: reusable-input-through-job-output
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            uses: ./.github/workflows/agent.yml
            with:
              text: ${{ github.event.issue.body }}
      .github/workflows/agent.yml: |
        on:
          workflow_call:
            inputs:
              text:
                type: string
        jobs:
          prepare:
            runs-on: ubuntu-latest
            outputs:
              task: ${{ steps.make.outputs.task }}
            steps:
              - id: make
                env:
                  TEXT: ${{ inputs.text }}
                run: echo "task=$TEXT" >> "$GITHUB_OUTPUT"
          run:
            needs: prepare
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: ${{ needs.prepare.outputs.task }}

guards:
  - name: permission-check-result-is-ignored
    expect: [AIA001, AIA006]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        permissions:
          contents: read
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - run: gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission"
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Answer: ${{ github.event.comment.body }}"

  - name: unsafe-field-picked-from-gh-output
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - id: pr
                run: |
                  pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/1")
                  branch=$(echo "$pr" | jq -r .head.ref)
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review ${{ steps.pr.outputs.branch }}."

  - name: open-path-past-a-partial-guard
    expect: [AIA009]
    files:
      .github/workflows/ai.yml: |
        on: [pull_request_target, issue_comment]
        permissions:
          contents: read
        jobs:
          prepare:
            if: >-
              github.event_name == 'pull_request_target' ||
              contains(fromJSON('["OWNER"]'), github.event.comment.author_association)
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
          review:
            needs: prepare
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Run gh pr view and review the pull request."

  - name: whole-object-picked-from-gh-output
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - id: pr
                run: |
                  pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/1")
                  head=$(echo "$pr" | jq -c .head)
                  echo "head=$head" >> "$GITHUB_OUTPUT"
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Review ${{ steps.pr.outputs.head }}."

  - name: select-keeps-the-whole-object
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issue_comment]
        jobs:
          ai:
            runs-on: ubuntu-latest
            steps:
              - run: gh api "repos/$GITHUB_REPOSITORY/pulls" --jq '.[] | select(.number == 1)' > pr.json
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Read pr.json and review it."

  - name: always-runs-past-a-guarded-job
    expect: [AIA001, AIA006]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        permissions:
          contents: read
        jobs:
          check:
            if: github.event.issue.author_association == 'OWNER'
            runs-on: ubuntu-latest
            steps:
              - run: echo ok
          ai:
            needs: check
            if: always()
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1.0.100
                with:
                  prompt: "Triage: ${{ github.event.issue.body }}"

gaps:
  - name: remote-reusable-workflow
    gap: true
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
        jobs:
          ai:
            uses: acme/shared/.github/workflows/agent.yml@v1
            with:
              text: ${{ github.event.issue.body }}

  - name: agent-inside-custom-script
    gap: true
    expect: [AIA001]
    files:
      .github/workflows/ai.yml: |
        on: [issues]
