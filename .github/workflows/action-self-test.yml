name: Action self-test

on:
  push:
    branches: ["main", "test/**"]
  pull_request:

permissions:
  contents: read

jobs:
  detects-vulnerable-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          paths: tests/fixtures/workflows/vulnerable.yml
          fail-on: high
          sarif-output: results.sarif
      - name: Action must fail and write a valid SARIF report
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          python - <<'PY'
          import json

          report = json.load(open("results.sarif", encoding="utf-8"))
          rules = {result["ruleId"] for result in report["runs"][0]["results"]}
          missing = {"AIA001", "AIA002", "AIA003", "AIA004", "AIA005", "AIA006"} - rules
          assert report["version"] == "2.1.0"
          assert not missing, f"Missing rules: {missing}"
          PY

  passes-hardened-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          paths: tests/fixtures/workflows/safe.yml
          fail-on: low

  ignores-shell-in-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          paths: "tests/fixtures/workflows/safe.yml ; touch pwned-paths $(touch pwned-subshell)"
          fail-on: low
          sarif-output: "out$(touch pwned-sarif).sarif"
      - name: Inputs must not run as shell commands
        run: |
          test ! -e pwned-paths
          test ! -e pwned-subshell
          test ! -e pwned-sarif

  emits-annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          paths: tests/fixtures/workflows/vulnerable.yml
          fail-on: none
