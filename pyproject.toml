[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-agent-audit"
version = "0.1.0"
description = "Find prompt injection and unsafe AI agent setups in GitHub Actions and GitLab CI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ci-agent-audit contributors" }
]
keywords = [
    "security",
    "github-actions",
    "ci-cd",
    "prompt-injection",
    "promptpwnd",
    "claude-code",
    "gemini-cli",
    "mcp",
    "static-analysis",
    "sarif",
    "ai-security",
    "gitlab-ci",
    "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/layer8labs8/ci-agent-audit"
Issues = "https://github.com/layer8labs8/ci-agent-audit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ci-agent-audit = "ci_agent_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ci_agent_audit = ["signatures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
