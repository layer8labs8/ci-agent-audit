id: aider-ci
name: Aider AI Pair Programmer in CI
vendor: Aider
description: Aider CLI and GitHub Actions used for automated code edits and issue resolution in CI workflows.
cli_binaries:
  - aider
cli_packages:
  - aider-chat
prompt_inputs:
  - message
  - prompt
  - instructions
cli_prompt_flags:
  - -m
  - --message
  - --message-file
dangerous_inputs: {}
dangerous_arg_patterns:
  - pattern: "--yes-always"
    reason: "Automatically confirms all file edits and shell commands suggested by the LLM in Aider."
  - pattern: "(?:^|\\s)--yes(?:\\s|$)"
    reason: "Auto-confirms all Aider prompts in headless CI."
